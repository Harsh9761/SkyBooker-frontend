<div class="auth-container">
  <div class="auth-box">
    <h2>Login ✈️</h2>

    <form #loginForm="ngForm">

      <!-- Email -->
      <input type="email" name="email" [(ngModel)]="email"
        placeholder="Email" required email #em="ngModel" />

      <small *ngIf="em.invalid && em.touched">
        Enter a valid email
      </small>

      <!-- Password -->
      <input type="password" name="password" [(ngModel)]="password"
        placeholder="Password" required minlength="6" #pw="ngModel" />

      <small *ngIf="pw.invalid && pw.touched">
        Password must be at least 6 characters
      </small>

      <!-- Button -->
      <button (click)="login()" [disabled]="loginForm.invalid">
        Login
      </button>

    </form>

    <p>
      Don’t have an account?
      <a routerLink="/register">Register</a>
    </p>
  </div>
</div>
