<div class="auth-container">

  <div class="auth-box">
    <h2>Register 🧾</h2>

    <input type="text" [(ngModel)]="fullName" placeholder="Full Name" />
    <input type="email" [(ngModel)]="email" placeholder="Email" />
    <input type="password" [(ngModel)]="password" placeholder="Password" />

    <input type="text" [(ngModel)]="phone" placeholder="Phone (10 digits)" />
    <input type="text" [(ngModel)]="passportNumber" placeholder="Passport Number" />
    <input type="text" [(ngModel)]="nationality" placeholder="Nationality" />

    <button (click)="register()">Register</button>

    <p>
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>

  </div>

</div>
