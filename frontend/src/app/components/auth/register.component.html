<div class="auth-container">
  <div class="auth-box">

    <h2>Register</h2>

    <form #registerForm="ngForm">

      <!-- FULL NAME -->
      <input type="text"
             name="fullName"
             [(ngModel)]="fullName"
             placeholder="Full Name"
             required
             minlength="3"
             #fn="ngModel" />

      <small *ngIf="fn.invalid && fn.touched">
        Name must be at least 3 characters
      </small>

      <!-- EMAIL -->
      <input type="email"
             name="email"
             [(ngModel)]="email"
             placeholder="Email"
             required
             email
             #em="ngModel" />

      <small *ngIf="em.invalid && em.touched">
        Enter valid email
      </small>

      <!-- PASSWORD -->
      <input type="password"
             name="password"
             [(ngModel)]="password"
             placeholder="Password"
             required
             minlength="6"
             #pw="ngModel" />

      <small *ngIf="pw.invalid && pw.touched">
        Password must be at least 6 characters
      </small>

      <!-- PHONE -->
      <input type="text"
             name="phone"
             [(ngModel)]="phone"
             placeholder="Phone (10 digits)"
             required
             pattern="^[0-9]{10}$"
             #ph="ngModel" />

      <small *ngIf="ph.invalid && ph.touched">
        Enter valid 10-digit phone number
      </small>

      <!-- PASSPORT -->
      <input type="text"
             name="passportNumber"
             [(ngModel)]="passportNumber"
             placeholder="Passport Number"
             required
             minlength="6"
             #pp="ngModel" />

      <small *ngIf="pp.invalid && pp.touched">
        Passport must be at least 6 characters
      </small>

      <!-- NATIONALITY -->
      <input type="text"
             name="nationality"
             [(ngModel)]="nationality"
             placeholder="Nationality"
             required
             #nt="ngModel" />

      <small *ngIf="nt.invalid && nt.touched">
        Nationality is required
      </small>

      <!--  OTP SECTION (BEFORE REGISTER BUTTON) -->

      <button type="button"
              class="otp-btn"
              (click)="sendOtp()"
              [disabled]="!email || em.invalid">
        Send OTP
      </button>

      <input type="text"
             name="otp"
             [(ngModel)]="otp"
             placeholder="Enter OTP"
             *ngIf="email" />

      <button type="button"
              class="otp-btn verify"
              (click)="verifyOtp()"
              [disabled]="!otp">
        Verify OTP
      </button>

      <p *ngIf="otpVerified" class="success-msg">
         Email Verified
      </p>

      <!-- REGISTER BUTTON (LAST) -->
      <button type="button"
              (click)="register()"
              [disabled]="registerForm.invalid || !otpVerified">
        Register
      </button>

    </form>

    <p>
      Already have account?
      <a routerLink="/login">Login</a>
    </p>

  </div>
</div>
